name = "compylertech-oware"
compatibility_date = "2026-06-14"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Non-secret runtime variables. On Cloudflare these are exposed to the server
# worker at runtime via the `env` binding and read in src/lib/api-proxy.ts as
# env.BACKEND_URL (same-origin /api/v1/* proxy to the corebanking backend).
#
# Do NOT put BACKEND_USER / BACKEND_PASSWORD here — they are credentials.
# Set them instead via:
#   Cloudflare dashboard → project → Settings → Variables and Secrets → add Secret
#   (or:  npx wrangler pages secret put BACKEND_USER
#         npx wrangler pages secret put BACKEND_PASSWORD)
[vars]
# Public base URL of the corebanking backend. MUST be reachable from Cloudflare
# (localhost / ngrok dev URLs won't work for a real deployment) — set the real one.
BACKEND_URL = "http://localhost:8084"
DEFAULT_TENANT_ID = "greenbank"